[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "teepay"
version = "0.1.0"
description = "Official Python SDK for the TeePay payments API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TeePay" }]
keywords = ["teepay", "payments", "mobile money", "tanzania", "checkout", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "mypy>=1.10; python_version >= '3.10'"]

[project.urls]
Homepage = "https://teepay.me"
Documentation = "https://docs.teepay.me/docs/sdks/python"
Source = "https://github.com/kraftonnotgar-spec/teepay-python"
Issues = "https://github.com/kraftonnotgar-spec/teepay-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/teepay"]

[tool.hatch.build.targets.sdist]
include = ["src/teepay", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
